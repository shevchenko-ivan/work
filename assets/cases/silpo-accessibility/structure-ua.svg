<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566a1f"/></marker></defs><rect width="760" height="380" fill="#ffffff"/><text x="12" y="28" font-size="15" font-weight="700" fill="#2b3218">Від стандарту до аудиту: однакова структура для обох продуктів</text><text x="12" y="58" font-size="12" font-weight="700" letter-spacing="1.5" fill="#566a1f">САЙТ</text><rect x="12" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="24" y="96" font-size="14" font-weight="700" fill="#2b3218">WCAG 2.1</text><text x="24" y="120" font-size="12" fill="#464e33">Стандарт,</text><text x="24" y="137" font-size="12" fill="#464e33">перекладений</text><text x="24" y="154" font-size="12" fill="#464e33">під Сільпо</text><path d="M149 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="162" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="174" y="96" font-size="14" font-weight="700" fill="#2b3218">Вебгайдлайн</text><text x="174" y="120" font-size="12" fill="#464e33">4 принципи</text><text x="174" y="137" font-size="12" fill="#464e33">13 настанов</text><text x="174" y="154" font-size="12" fill="#464e33">78 критеріїв</text><text x="174" y="171" font-size="12" fill="#464e33">+ техніки W3C</text><path d="M299 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="312" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="324" y="96" font-size="14" font-weight="700" fill="#2b3218">Тріаж</text><text x="324" y="120" font-size="12" fill="#464e33">Кожен критерій має</text><text x="324" y="137" font-size="12" fill="#464e33">рівень (A/AA/AAA)</text><text x="324" y="154" font-size="12" fill="#464e33">і відповідального</text><path d="M449 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="462" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="474" y="96" font-size="14" font-weight="700" fill="#2b3218">План з 5 кроків</text><text x="474" y="120" font-size="12" fill="#464e33">Дизайн → A →</text><text x="474" y="137" font-size="12" fill="#464e33">анімація → текст</text><text x="474" y="154" font-size="12" fill="#464e33">→ AA → AAA</text><path d="M599 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="612" y="70" width="136" height="118" rx="14" fill="#37431d"/><text x="624" y="96" font-size="14" font-weight="700" fill="#ffffff">Дизайн-аудит</text><text x="624" y="120" font-size="12" fill="#ffffff">6 критеріїв</text><text x="624" y="137" font-size="12" fill="#ffffff">4 типи сторінок</text><text x="624" y="154" font-size="12" fill="#ffffff">десктоп + мобайл</text><text x="624" y="171" font-size="12" fill="#ffffff">екран за екраном</text><text x="12" y="210" font-size="12" font-weight="700" letter-spacing="1.5" fill="#566a1f">МОБІЛЬНИЙ ЗАСТОСУНОК</text><rect x="12" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="24" y="248" font-size="14" font-weight="700" fill="#2b3218">Гайдлайн app</text><text x="24" y="272" font-size="12" fill="#464e33">12 категорій</text><text x="24" y="289" font-size="12" fill="#464e33">52 практики</text><text x="24" y="306" font-size="12" fill="#464e33">iOS + Android</text><text x="24" y="323" font-size="12" fill="#464e33">як тестувати</text><path d="M149 281.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="162" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="174" y="248" font-size="14" font-weight="700" fill="#2b3218">Типи практик</text><text x="174" y="272" font-size="12" fill="#464e33">Must · Should</text><text x="174" y="289" font-size="12" fill="#464e33">Never · Avoid</text><path d="M299 281.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="312" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="32