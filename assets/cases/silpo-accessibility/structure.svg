<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566a1f"/></marker></defs><rect width="760" height="380" fill="#ffffff"/><text x="12" y="28" font-size="15" font-weight="700" fill="#2b3218">From standard to audit: the same structure for both products</text><text x="12" y="58" font-size="12" font-weight="700" letter-spacing="1.5" fill="#566a1f">WEBSITE</text><rect x="12" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="24" y="96" font-size="14" font-weight="700" fill="#2b3218">WCAG 2.1</text><text x="24" y="120" font-size="12" fill="#464e33">Source standard,</text><text x="24" y="137" font-size="12" fill="#464e33">translated and</text><text x="24" y="154" font-size="12" fill="#464e33">adapted to Silpo</text><path d="M149 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="162" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="174" y="96" font-size="14" font-weight="700" fill="#2b3218">Web guideline</text><text x="174" y="120" font-size="12" fill="#464e33">4 principles</text><text x="174" y="137" font-size="12" fill="#464e33">13 guidelines</text><text x="174" y="154" font-size="12" fill="#464e33">78 criteria</text><text x="174" y="171" font-size="12" fill="#464e33">+ W3C techniques</text><path d="M299 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="312" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="324" y="96" font-size="14" font-weight="700" fill="#2b3218">Triage</text><text x="324" y="120" font-size="12" fill="#464e33">Each criterion gets</text><text x="324" y="137" font-size="12" fill="#464e33">a level (A/AA/AAA)</text><text x="324" y="154" font-size="12" fill="#464e33">and an owner team</text><path d="M449 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="462" y="70" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="474" y="96" font-size="14" font-weight="700" fill="#2b3218">5-step plan</text><text x="474" y="120" font-size="12" fill="#464e33">Design → A →</text><text x="474" y="137" font-size="12" fill="#464e33">animation → text</text><text x="474" y="154" font-size="12" fill="#464e33">→ AA → AAA</text><path d="M599 129.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="612" y="70" width="136" height="118" rx="14" fill="#37431d"/><text x="624" y="96" font-size="14" font-weight="700" fill="#ffffff">Design audit</text><text x="624" y="120" font-size="12" fill="#ffffff">6 criteria</text><text x="624" y="137" font-size="12" fill="#ffffff">4 page types</text><text x="624" y="154" font-size="12" fill="#ffffff">desktop + mobile</text><text x="624" y="171" font-size="12" fill="#ffffff">screen-by-screen</text><text x="12" y="210" font-size="12" font-weight="700" letter-spacing="1.5" fill="#566a1f">MOBILE APP</text><rect x="12" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="24" y="248" font-size="14" font-weight="700" fill="#2b3218">Mobile guideline</text><text x="24" y="272" font-size="12" fill="#464e33">12 categories</text><text x="24" y="289" font-size="12" fill="#464e33">52 practices</text><text x="24" y="306" font-size="12" fill="#464e33">iOS + Android</text><text x="24" y="323" font-size="12" fill="#464e33">testing procedure</text><path d="M149 281.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="162" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="174" y="248" font-size="14" font-weight="700" fill="#2b3218">Typed practices</text><text x="174" y="272" font-size="12" fill="#464e33">Must · Should</text><text x="174" y="289" font-size="12" fill="#464e33">Never · Avoid</text><path d="M299 281.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="312" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="324" y="248" font-size="14" font-weight="700" fill="#2b3218">Triage</text><text x="324" y="272" font-size="12" fill="#464e33">Each practice gets</text><text x="324" y="289" font-size="12" fill="#464e33">a step in the plan</text><path d="M449 281.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="462" y="222" width="136" height="118" rx="14" fill="#f3f0e6"/><text x="474" y="248" font-size="14" font-weight="700" fill="#2b3218">4-step plan</text><text x="474" y="272" font-size="12" fill="#464e33">Mockups → Must →</text><text x="474" y="289" font-size="12" fill="#464e33">remove Never →</text><text x="474" y="306" font-size="12" fill="#464e33">Should</text><path d="M599 281.0h10" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/><rect x="612" y="222" width="136" height="118" rx="14" fill="#37431d"/><text x="624" y="248" font-size="14" font-weight="700" fill="#ffffff">App audit</text><text x="624" y="272" font-size="12" fill="#ffffff">4 areas</text><text x="624" y="289" font-size="12" fill="#ffffff">12 screen groups</text><text x="624" y="306" font-size="12" fill="#ffffff">contrast, colour,</text><text x="624" y="323" font-size="12" fill="#ffffff">targets, focus</text><text x="12" y="368" font-size="12" fill="#666c53">Every audit finding links back to the guideline page that explains the criterion and the fix.</text></svg>