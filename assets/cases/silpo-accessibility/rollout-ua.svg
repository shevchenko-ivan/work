<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 658" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"><rect width="760" height="658" fill="#ffffff"/><text x="16" y="30" font-size="15" font-weight="700" fill="#2b3218">Запропонований план: хто що робить і в якому порядку</text><line x1="250" y1="70" x2="250" y2="618" stroke="#e2e5d8"/><line x1="372" y1="70" x2="372" y2="618" stroke="#e2e5d8"/><line x1="495" y1="70" x2="495" y2="618" stroke="#e2e5d8"/><line x1="618" y1="70" x2="618" y2="618" stroke="#e2e5d8"/><line x1="740" y1="70" x2="740" y2="618" stroke="#e2e5d8"/><text x="311" y="62" font-size="12" font-weight="600" text-anchor="middle" fill="#2b3218">Пріоритет 1</text><text x="434" y="62" font-size="12" font-weight="600" text-anchor="middle" fill="#2b3218">Пріоритет 2</text><text x="556" y="62" font-size="12" font-weight="600" text-anchor="middle" fill="#2b3218">Пріоритет 3</text><text x="679" y="62" font-size="12" font-weight="600" text-anchor="middle" fill="#2b3218">Пріоритет 4</text><text x="16" y="114" font-size="12" font-weight="700" letter-spacing="1.5" fill="#566a1f">ВЕБ</text><text x="16" y="139" font-size="12" fill="#666c53">Дизайн</text><text x="16" y="155" font-size="13" font-weight="600" fill="#2b3218">Виправити макети</text><rect x="253" y="130" width="116" height="28" rx="14" fill="#37431d"/><text x="265" y="148" font-size="12" font-weight="600" fill="#ffffff">6 критеріїв</text><text x="16" y="181" font-size="12" fill="#666c53">Розробка</text><text x="16" y="197" font-size="13" font-weight="600" fill="#2b3218">Рівень A в описах задач</text><rect x="376" y="172" width="116" height="28" rx="14" fill="#37431d"/><text x="388" y="190" font-size="12" font-weight="600" fill="#ffffff">13 критеріїв</text><text x="16" y="223" font-size="12" fill="#666c53">Маркетинг</text><text x="16" y="239" font-size="13" font-weight="600" fill="#2b3218">Перевірка анімацій і банерів</text><rect x="376" y="214" width="116" height="28" rx="14" fill="#37431d"/><rect x="492" y="214" width="245" height="28" rx="14" fill="none" stroke="#37431d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="506" y="232" font-size="11" fill="#464e33">постійно: кожен банер і анімація</text><text x="388" y="232" font-size="12" font-weight="600" fill="#ffffff">3 критерії</text><text x="16" y="265" font-size="12" fill="#666c53">Контент</text><text x="16" y="281" font-size="13" font-weight="600" fill="#2b3218">Перевірка текстів</text><rect x="376" y="256" width="116" height="28" rx="14" fill="#37431d"/><rect x="492" y="256" width="245" height="28" rx="14" fill="none" stroke="#37431d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="506" y="274" font-size="11" fill="#464e33">постійно: кожен новий текст</text><text x="388" y="274" font-size="12" font-weight="600" fill="#ffffff">6 критеріїв</text><text x="16" y="307" font-size="12" fill="#666c53">Розробка + дизайн</text><text x="16" y="323" font-size="13" font-weight="600" fill="#2b3218">Рівень AA</text><rect x="498" y="298" width="116" height="28" rx="14" fill="#37431d"/><text x="510" y="316" font-size="12" font-weight="600" fill="#ffffff">18 критеріїв</text><text x="16" y="349" font-size="12" fill="#666c53">Дослідження</text><text x="16" y="365" font-size="13" font-weight="600" fill="#2b3218">Опитати людей з інвалідністю</text><rect x="620" y="340" width="61" height="28" rx="14" fill="#c8f24a"/><text x="632" y="358" font-size="12" font-weight="600" fill="#2b3218">анкета</text><text x="16" y="391" font-size="12" fill="#666c53">Розробка + дизайн</text><text x="16" y="407" font-size="13" font-weight="600" fill="#2b3218">Рівень AAA, якщо опитування це підтвердить</text><rect x="688" y="382" width="49" height="28" rx="14" fill="#e7e7f7" stroke="#37431d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="700" y="400" font-size="12" font-weight="600" fill="#2b3218">18</text><text x="16" y="438" font-size="12" font-weight="700" letter-spacing="1.5" fill="#566a1f">ЗАСТОСУНОК</text><text x="16" y="463" font-size="12" fill="#666c53">Дизайн</text><text x="16" y="479" font-size="13" font-weight="600" fill="#2b3218">Виправити макети</text><rect x="253" y="454" width="116" height="28" rx="14" fill="#37431d"/><text x="265" y="472" font-size="12" font-weight="600" fill="#ffffff">4 напрями</text><text x="16" y="505" font-size="12" fill="#666c53">Розробка</text><text x="16" y="521" font-size="13" font-weight="600" fill="#2b3218">Практики «Must»</text><rect x="376" y="496" width="116" height="28" rx="14" fill="#37431d"/><text x="388" y="514" font-size="12" font-weight="600" fill="#ffffff">23</text><text x="16" y="547" font-size="12" fill="#666c53">Розробка</text><text x="16" y="563" font-size="13" font-weight="600" fill="#2b3218">Прибрати патерни «Never»</text><rect x="498" y="538" width="116" height="28" rx="14" fill="#37431d"/><text x="510" y="556" font-size="12" font-weight="600" fill="#ffffff">8</text><text x="16" y="589" font-size="12" fill="#666c53">Розробка</text><text x="16" y="605" font-size="13" font-weight="600" fill="#2b3218">Практики «Should»</text><rect x="620" y="580" width="116" height="28" rx="14" fill="#37431d"/><text x="632" y="598" font-size="12" font-weight="600" fill="#ffffff">12</text><g font-size="11" fill="#464e33" transform="translate(16 636)"><rect width="22" height="10" rx="5" fill="#37431d"/><text x="28" y="9">заплановано</text><rect x="120" width="22" height="10" rx="5" fill="none" stroke="#37431d" stroke-dasharray="4 3"/><text x="148" y="9">постійно / за умовою</text><rect x="290" width="22" height="10" rx="5" fill="#c8f24a"/><text x="318" y="9">після дослідження</text><text x="450" y="9" fill="#666c53">Порядок — з плану, без дат.</text></g></svg>