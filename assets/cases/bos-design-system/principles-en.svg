<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"><defs><clipPath id="c"><rect width="1600" height="900"/></clipPath></defs><g clip-path="url(#c)"><rect width="1600" height="900" fill="#f7f8fc"/><circle cx="1590" cy="880" r="250" fill="#0cc6f5"/><rect x="1430" y="720" width="220" height="220" rx="28" fill="#2f6bea" transform="rotate(35 1540 830)"/><rect x="1450" y="740" width="230" height="230" rx="30" fill="#ecb64a" transform="rotate(15 1565 855)"/><path d="M1566 840l26 0 13 22-13 22-26 0-13-22z" fill="#0b0b12"/><g transform="translate(112 86) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="8" fill="none"/><path d="M12.0 0.0L16.0 0.0"/><path d="M8.5 8.5L11.3 11.3"/><path d="M0.0 12.0L0.0 16.0"/><path d="M-8.5 8.5L-11.3 11.3"/><path d="M-12.0 0.0L-16.0 0.0"/><path d="M-8.5 -8.5L-11.3 -11.3"/><path d="M-0.0 -12.0L-0.0 -16.0"/><path d="M8.5 -8.5L11.3 -11.3"/></g><text x="182" y="98" font-size="30" font-weight="700" fill="#1b1b22">Clarity and familiarity:</text><text x="182" y="134" font-size="19.5" fill="#2a2a33">Intuitive at a glance, with focus on the target action, so even new users</text><text x="182" y="158" font-size="19.5" fill="#2a2a33">complete tasks without wasting time on training.</text><g transform="translate(112 220) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -17l6 6-6 6-6-6z"/><path d="M-11 -6l6 6-6 6-6-6z"/><path d="M11 -6l6 6-6 6-6-6z"/><path d="M0 5l6 6-6 6-6-6z"/></g><text x="182" y="232" font-size="30" font-weight="700" fill="#1b1b22">Consistency and predictability:</text><text x="182" y="268" font-size="19.5" fill="#2a2a33">We design on unified visual patterns and terminology to keep the interface</text><text x="182" y="292" font-size="19.5" fill="#2a2a33">predictable, reduce cognitive load and improve usability.</text><g transform="translate(112 354) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -12h7a5 5 0 1 1 10 0h7v8a5 5 0 1 0 0 10v8h-24v-8a5 5 0 1 1 0-10z"/></g><text x="182" y="366" font-size="30" font-weight="700" fill="#1b1b22">Scalability and modularity:</text><text x="182" y="402" font-size="19.5" fill="#2a2a33">Adapts to different devices; components can be reused in other apps and pages of</text><text x="182" y="426" font-size="19.5" fill="#2a2a33">the platform, so features scale without losing usability or stability.</text><g transform="translate(112 488) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 10l10-10 7 6 15-15"/><path d="M8 -9h8v8"/></g><text x="182" y="500" font-size="30" font-weight="700" fill="#1b1b22">Research and efficiency:</text><text x="182" y="536" font-size="19.5" fill="#2a2a33">Design rests on validated research and analysed business and user needs. We use</text><text x="182" y="560" font-size="19.5" fill="#2a2a33">available data to refine the interface for maximum efficiency.</text><g transform="translate(112 622) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="6" fill="none"/><path d="M-11 13a11 9 0 0 1 22 0"/><circle cx="-13" cy="-3" r="4" fill="none"/><circle cx="13" cy="-3" r="4" fill="none"/><path d="M-20 10a8 6 0 0 1 6-6"/><path d="M20 10a8 6 0 0 0-6-6"/></g><text x="182" y="634" font-size="30" font-weight="700" fill="#1b1b22">Collaboration:</text><text x="182" y="670" font-size="19.5" fill="#2a2a33">Working with different teams and roles (developers, analysts, project managers</text><text x="182" y="694" font-size="19.5" fill="#2a2a33">and stakeholders) lets us cover the most scenarios and keep decisions aligned</text><text x="182" y="718" font-size="19.5" fill="#2a2a33">and of high quality.</text></g></svg>