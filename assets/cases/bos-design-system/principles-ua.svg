<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"><defs><clipPath id="c"><rect width="1600" height="900"/></clipPath></defs><g clip-path="url(#c)"><rect width="1600" height="900" fill="#f7f8fc"/><circle cx="1590" cy="880" r="250" fill="#0cc6f5"/><rect x="1430" y="720" width="220" height="220" rx="28" fill="#2f6bea" transform="rotate(35 1540 830)"/><rect x="1450" y="740" width="230" height="230" rx="30" fill="#ecb64a" transform="rotate(15 1565 855)"/><path d="M1566 840l26 0 13 22-13 22-26 0-13-22z" fill="#0b0b12"/><g transform="translate(112 86) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="8" fill="none"/><path d="M12.0 0.0L16.0 0.0"/><path d="M8.5 8.5L11.3 11.3"/><path d="M0.0 12.0L0.0 16.0"/><path d="M-8.5 8.5L-11.3 11.3"/><path d="M-12.0 0.0L-16.0 0.0"/><path d="M-8.5 -8.5L-11.3 -11.3"/><path d="M-0.0 -12.0L-0.0 -16.0"/><path d="M8.5 -8.5L11.3 -11.3"/></g><text x="182" y="98" font-size="30" font-weight="700" fill="#1b1b22">Зрозумілість та знайомість:</text><text x="182" y="134" font-size="19.5" fill="#2a2a33">Інтуїтивне сприйняття функціоналу з одного погляду та фокус на цільовій дії, що</text><text x="182" y="158" font-size="19.5" fill="#2a2a33">дозволяє навіть новим користувачам легко виконувати завдання без зайвих витрат часу</text><text x="182" y="182" font-size="19.5" fill="#2a2a33">на навчання.</text><g transform="translate(112 244) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -17l6 6-6 6-6-6z"/><path d="M-11 -6l6 6-6 6-6-6z"/><path d="M11 -6l6 6-6 6-6-6z"/><path d="M0 5l6 6-6 6-6-6z"/></g><text x="182" y="256" font-size="30" font-weight="700" fill="#1b1b22">Консистентність та послідовність:</text><text x="182" y="292" font-size="19.5" fill="#2a2a33">Створюємо дизайни на основі уніфікованих візуальних патернів та термінології, для</text><text x="182" y="316" font-size="19.5" fill="#2a2a33">забезпечення передбачуваності, мінімізуючи когнітивне навантаження і підвищуючи</text><text x="182" y="340" font-size="19.5" fill="#2a2a33">зручність.</text><g transform="translate(112 402) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -12h7a5 5 0 1 1 10 0h7v8a5 5 0 1 0 0 10v8h-24v-8a5 5 0 1 1 0-10z"/></g><text x="182" y="414" font-size="30" font-weight="700" fill="#1b1b22">Масштабованість та модульність:</text><text x="182" y="450" font-size="19.5" fill="#2a2a33">Адаптивність до різних пристроїв, можливість перевикористовувати компоненти на інших</text><text x="182" y="474" font-size="19.5" fill="#2a2a33">застосунках та сторінках платформи, дозволяючи масштабувати функціонал без втрати</text><text x="182" y="498" font-size="19.5" fill="#2a2a33">зручності та стабільності.</text><g transform="translate(112 560) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 10l10-10 7 6 15-15"/><path d="M8 -9h8v8"/></g><text x="182" y="572" font-size="30" font-weight="700" fill="#1b1b22">Дослідження та ефективність:</text><text x="182" y="608" font-size="19.5" fill="#2a2a33">Дизайн базуються на підтверджених дослідженнями і проаналізованих потребах бізнесу</text><text x="182" y="632" font-size="19.5" fill="#2a2a33">та користувачів. Використовуємо доступні дані для вдосконалення інтерфейсу з метою</text><text x="182" y="656" font-size="19.5" fill="#2a2a33">досягнення максимальної ефективності.</text><g transform="translate(112 718) scale(1.5)" fill="none" stroke="#1b1b22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="6" fill="none"/><path d="M-11 13a11 9 0 0 1 22 0"/><circle cx="-13" cy="-3" r="4" fill="none"/><circle cx="13" cy="-3" r="4" fill="none"/><path d="M-20 10a8 6 0 0 1 6-6"/><path d="M20 10a8 6 0 0 0-6-6"/></g><text x="182" y="730" font-size="30" font-weight="700" fill="#1b1b22">Колаборація:</text><text x="182" y="766" font-size="19.5" fill="#2a2a33">Співпраця з різними командами та ролями (розробники, аналітики, менеджери проєктів</text><text x="182" y="790" font-size="19.5" fill="#2a2a33">та стейкхолдери) дозволяє врахувати максимальну кількість сценаріїв та забезпечити</text><text x="182" y="814" font-size="19.5" fill="#2a2a33">узгодженість і якість рішень.</text></g></svg>