<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566a1f"/></marker></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="12" y="28" font-size="15" font-weight="700" fill="#2b3218">Токени у трьох шарах, синхронізовані з Figma в код</text>
