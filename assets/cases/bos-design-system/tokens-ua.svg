<path d="M242 117h18" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/>
<rect x="266" y="48" width="226" height="138" rx="14" fill="#f3f0e6"/><text x="280" y="72" font-size="12" font-weight="700" fill="#566a1f" letter-spacing="1">СЕМАНТИЧНІ</text><text x="280" y="110" font-size="32" font-weight="700" fill="#2b3218">245</text><text x="280" y="134" font-size="12" fill="#464e33">світла й темна теми</text><text x="280" y="150" font-size="12" fill="#464e33">текст, поверхня, межа, статус</text>
<path d="M496 117h18" stroke="#566a1f" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="48" width="228" height="138" rx="14" fill="#37431d"/><text x="534" y="72" font-size="12" font-weight="700" fill="#c8f24a" letter-spacing="1">КОМПОНЕНТНІ</text><text x="534" y="110" font-size="32" font-weight="700" fill="#ffffff">1,029</text><text x="534" y="134" font-size="12" fill="#e0ead2">Button 136 · Input 71</text><text x="534" y="150" font-size="12" fill="#e0ead2">Table 58 · та інші</text>
<text x="12" y="222" font-size="12" fill="#666c53">Створюються в Tokens Studio → merge request → style-dictionary → реліз у React UI-кіті через semantic-release</text>
<rect x="12" y="244" width="226" height="150" rx="14" fill="#f3f0e6"/><text x="26" y="268" font-size="12" font-weight="700" fill="#566a1f" letter-spacing="1">БІБЛІОТЕКА FIGMA</text><text x="26" y="306" font-size="32" font-weight="700" fill="#2b3218">255</text><text x="26" y="330" font-size="12" fill="#464e33">компонентів, 32 застарілі</text><text x="26" y="346" font-size="12" fill="#464e33">25 текстових стилів, колір = змінні</text>
<rect x="266" y="244" width="226" height="150" rx="14" fill="#f3f0e6"/><text x="280" y="268" font-size="12" font-weight="700" fill="#566a1f" letter-spacing="1">CODE CONNECT</text><text x="280" y="306" font-size="32" font-weight="700" fill="#2b3218">550</text><text x="280" y="330" font-size="12" fill="#464e33">55 компонентів + 495 іконок</text><text x="280" y="346" font-size="12" fill="#464e33">Figma показує реальний React-код</text>
<rect x="520" y="244" width="228" height="150" rx="14" fill="#f3f0e6"/><text x="534" y="268" font-size="12" font-weight="700" fill="#566a1f" letter-spacing="1">STORYBOOK → FIGMA</text><text x="534" y="306" font-size="32" font-weight="700" fill="#2b3218">617/628</text><text x="534" y="330" font-size="12" fill="#464e33">теги stories → варіанти Figma</text><text x="534" y="346" font-size="12" fill="#464e33">(59 тегів, 265 правил)</text>
