<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#c8f24a" fill-opacity=".14"/></pattern>
    <marker id="tick" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M4 0v8" stroke="#c8f24a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="800" height="500" fill="#37431d"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <text x="48" y="64" fill="#c8f24a" font-size="15" font-weight="600" letter-spacing="1.5">BOS / BUTTON / PRIMARY</text>
  <text x="48" y="88" fill="#ffffff" fill-opacity=".55" font-size="14">anatomy · tokens · states</text>

  <!-- component -->
  <rect x="250" y="210" width="300" height="72" rx="36" fill="#c8f24a"/>
  <text x="400" y="254" text-anchor="middle" fill="#37431d" font-size="24" font-weight="600">Save changes</text>
  <!-- padding box -->
  <rect x="250" y="210" width="300" height="72" rx="36" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-dasharray="4 5"/>

  <!-- redlines -->
  <g stroke="#c8f24a" stroke-width="1.5" fill="none">
    <path d="M250 180h40" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <path d="M590 210v72" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <path d="M250 320h300" marker-start="url(#tick)" marker-end="url(#tick)" stroke-opacity=".6"/>
  </g>
  <g fill="#c8f24a" font-size="14" font-weight="600">
    <text x="270" y="170" text-anchor="middle">24</text>
    <text x="604" y="251">48</text>
    <text x="400" y="344" text-anchor="middle" fill-opacity=".8">fill · min 120</text>
  </g>

  <!-- token call-outs -->
  <g font-size="14">
    <path d="M318 210 L200 132" stroke="#ffffff" stroke-opacity=".35"/>
    <rect x="48" y="112" width="190" height="40" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <circle cx="70" cy="132" r="7" fill="#c8f24a"/>
    <text x="86" y="137" fill="#ffffff">color.action.bg</text>

    <path d="M540 230 L610 132" stroke="#ffffff" stroke-opacity=".35"/>
    <rect x="566" y="112" width="186" height="40" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="588" y="137" fill="#ffffff">radius.pill · 999</text>

    <path d="M400 282 L400 300" stroke="#ffffff" stroke-opacity="0"/>
    <path d="M300 262 L180 392" stroke="#ffffff" stroke-opacity=".35"/>
    <rect x="48" y="372" width="214" height="40" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="70" y="397" fill="#ffffff">type.label.lg · 600</text>
  </g>

  <!-- states strip -->
  <g font-size="13" font-weight="600">
    <rect x="470" y="380" width="86" height="32" rx="16" fill="#c8f24a"/><text x="513" y="401" text-anchor="middle" fill="#37431d">default</text>
    <rect x="566" y="380" width="86" height="32" rx="16" fill="#d6f56e"/><text x="609" y="401" text-anchor="middle" fill="#37431d">hover</text>
    <rect x="662" y="380" width="90" height="32" rx="16" fill="#ffffff" fill-opacity=".14"/><text x="707" y="401" text-anchor="middle" fill="#ffffff" fill-opacity=".6">disabled</text>
  </g>
</svg>
