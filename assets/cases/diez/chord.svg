<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#37431d" fill-opacity=".12"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#e0ead2"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <!-- phone -->
  <rect x="270" y="36" width="260" height="500" rx="40" fill="#faf8f1" stroke="#37431d" stroke-opacity=".12"/>
  <rect x="352" y="52" width="96" height="10" rx="5" fill="#37431d" fill-opacity=".12"/>
  <text x="400" y="116" text-anchor="middle" fill="#2b3218" font-size="44" font-weight="700" letter-spacing="-1">Am7</text>
  <text x="400" y="142" text-anchor="middle" fill="#666c53" font-size="14">A minor seventh · open</text>

  <!-- fretboard: 6 strings, 4 frets -->
  <g transform="translate(320 176)">
    <rect x="0" y="0" width="160" height="6" rx="2" fill="#37431d"/>
    <g stroke="#37431d" stroke-opacity=".35" stroke-width="2">
      <path d="M0 50h160M0 100h160M0 150h160M0 200h160"/>
    </g>
    <g stroke="#37431d" stroke-opacity=".55" stroke-width="1.5">
      <path d="M0 0v200M32 0v200M64 0v200M96 0v200M128 0v200M160 0v200"/>
    </g>
    <!-- x o markers -->
    <g font-size="14" font-weight="600" fill="#37431d" text-anchor="middle">
      <text x="0" y="-12">×</text><text x="32" y="-12">○</text><text x="96" y="-12">○</text><text x="160" y="-12">○</text>
    </g>
    <!-- fingers -->
    <g fill="#37431d">
      <circle cx="64" cy="75" r="14"/><circle cx="128" cy="25" r="14"/>
    </g>
    <g fill="#c8f24a" font-size="13" font-weight="700" text-anchor="middle">
      <text x="64" y="80">2</text><text x="128" y="30">1</text>
    </g>
  </g>

  <!-- progression chips -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="292" y="416" width="64" height="36" rx="18" fill="#37431d"/><text x="324" y="439" fill="#c8f24a">Am7</text>
    <rect x="368" y="416" width="64" height="36" rx="18" fill="#ffffff" stroke="#37431d" stroke-opacity=".15"/><text x="400" y="439" fill="#2b3218">D9</text>
    <rect x="444" y="416" width="64" height="36" rx="18" fill="#ffffff" stroke="#37431d" stroke-opacity=".15"/><text x="476" y="439" fill="#2b3218">G</text>
  </g>

  <!-- side annotations -->
  <g font-size="14" fill="#37431d">
    <text x="48" y="64" font-weight="600" letter-spacing="1.5" fill="#566a1f">DIEZ / CHORD VIEW</text>
    <text x="48" y="88" fill-opacity=".7">mobile-first</text><text x="48" y="108" fill-opacity=".7">one hand, on a music stand</text>
    <path d="M250 250 H200" stroke="#37431d" stroke-opacity=".3"/>
    <text x="48" y="246">tap target</text><text x="48" y="266" font-weight="600">44 × 44</text>
    <path d="M550 434 H600" stroke="#37431d" stroke-opacity=".3"/>
    <text x="612" y="430">progression</text><text x="612" y="450" font-weight="600">builder</text>
  </g>
</svg>
